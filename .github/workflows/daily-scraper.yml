name: Daily Cricket Channels Scraper

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-channels:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install Playwright deps
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Google Chrome
        run: npx playwright install chrome

      - name: Start server + Run scraper (single step)
        env:
          HEADLESS: 'false'
        run: |
          set +e
          echo "=== Starting Playwright server ==="
          xvfb-run -a --server-args="-screen 0 1366x768x24" \
            node playwright-server.js > pw.log 2>&1 &
          SERVER_PID=$!
          echo "server shell PID: $SERVER_PID"

          echo "=== Waiting for server ready (max 30s) ==="
          READY=0
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -X POST \
                -H 'Content-Type: application/json' \
                -d '{"url":"https://example.com"}' \
                http://127.0.0.1:9999/ 2>/dev/null; then
              echo "✅ Server ready after ${i}s"
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" != "1" ]; then
            echo "❌ Server did NOT start in 30s — dumping log:"
            cat pw.log
            exit 1
          fi

          echo ""
          echo "=== Running scraper ==="
          php scraper.php --output channels.json
          SCRAPER_EXIT=$?
          echo "scraper exit code: $SCRAPER_EXIT"

          echo ""
          echo "===== Playwright server log (full) ====="
          cat pw.log

          echo ""
          echo "=== Stopping server ==="
          kill $SERVER_PID 2>/dev/null || true
          pkill -f playwright-server 2>/dev/null || true
          pkill -f "chrome.*--headless" 2>/dev/null || true

          exit $SCRAPER_EXIT

      - name: Commit and push
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add channels.json
          git commit -m "Update channels.json - $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
