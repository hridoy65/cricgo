name: Daily Cricket Channels Scraper

on:
  schedule:
    # Runs every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch:
    # Allows manual trigger

permissions:
  contents: write

jobs:
  scrape-channels:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json
          tools: composer:v2
      
      - name: Run scraper
        run: |
          php scraper.php --output channels.json
          # JSON ফাইলের ভেতর টাইমস্ট্যাম্প যুক্ত করে ফাইলটি ফিজিক্যালি আপডেট করা
          php -r '$d = json_decode(file_get_contents("channels.json"), true); if(is_array($d)) { $d["_last_updated"] = date("Y-m-d H:i:s T"); file_put_contents("channels.json", json_encode($d, JSON_PRETTY_PRINT)); }'
        env:
          TZ: UTC
      
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add channels.json
          git commit -m "Update channels.json - $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
