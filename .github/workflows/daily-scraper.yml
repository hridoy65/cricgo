name: Daily Cricket Channels Scraper

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-channels:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Google Chrome
        run: npx playwright install chrome

      - name: Start Playwright server
        run: |
          node playwright-server.js > pw.log 2>&1 &
          echo $! > pw.pid
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" -X POST \
                -H 'Content-Type: application/json' \
                -d '{"url":"https://example.com"}' \
                http://127.0.0.1:9999/ | grep -q '200'; then
              echo "✅ Playwright server ready"
              break
            fi
            sleep 1
          done

      - name: Run scraper
        run: |
          php scraper.php --output channels.json
        env:
          TZ: UTC

      - name: Show Playwright log
        if: always()
        run: |
          echo "===== Playwright server log ====="
          cat pw.log || true

      - name: Stop Playwright server
        if: always()
        run: |
          [ -f pw.pid ] && kill $(cat pw.pid) || true

      - name: Commit and push
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add channels.json
          git commit -m "Update channels.json - $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
